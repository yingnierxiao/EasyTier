[package]
name = "easytier-ios"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
async-trait.workspace = true
anyhow.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "io-util", "time", "sync", "macros"] }
easytier = { workspace = true, default-features = true }
easytier-core = { workspace = true, default-features = true }
uuid.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, default-features = true, features = ["env-filter"] }
easytier-ffi = { workspace = true, features = [
    "c-abi",
] }

[dev-dependencies]
uuid.workspace = true
easytier-core = { workspace = true, default-features = true }
easytier-ffi = { workspace = true, features = [
    "c-abi",
    "ffi-dataplane",
] }
