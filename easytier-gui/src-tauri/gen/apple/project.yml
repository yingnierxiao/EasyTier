name: easytier-gui
options:
  bundleIdPrefix: com.yingnierxiao.easytier
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: easytier-gui
      PRODUCT_BUNDLE_IDENTIFIER: com.yingnierxiao.easytier
      DEVELOPMENT_TEAM: RWAXP5Y679
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  easytier-gui_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: easytier-gui_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: easytier-gui_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: "EasyTier 需要连接局域网中的组网节点。"
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 2.7.2
        CFBundleVersion: "2.7.2"
    entitlements:
      path: easytier-gui_iOS/easytier-gui_iOS.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: NetworkExtension.framework
      - target: PacketTunnel
        embed: true
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: node "${PROJECT_DIR}/../../../node_modules/@tauri-apps/cli/tauri.js" ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: EasyTier VPN Extension
        CFBundleShortVersionString: 2.7.2
        CFBundleVersion: "2.7.2"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yingnierxiao.easytier.PacketTunnel
        DEVELOPMENT_TEAM: RWAXP5Y679
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: true
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: PacketTunnel/EasyTierCore.h
        ENABLE_USER_SCRIPT_SANDBOXING: false
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        SKIP_INSTALL: true
        LIBRARY_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Externals/packet-tunnel/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME)
        OTHER_LDFLAGS: $(inherited) -leasytier_ios -lresolv -liconv
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    preBuildScripts:
      - name: Build EasyTier Packet Tunnel Core
        script: bash "$PROJECT_DIR/../../../../script/build-ios-packet-tunnel.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(PROJECT_DIR)/Externals/packet-tunnel/$(PLATFORM_NAME)/libeasytier_ios.a
